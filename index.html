<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Stino 180 — Gallery</title>
    <meta name="description" content="Explore the creative works of Stino 180. A curated gallery of music, projects, and connections." />
    <meta name="author" content="Stino 180" />

    <meta property="og:title" content="Stino 180 — Gallery" />
    <meta property="og:description" content="Explore the creative works of Stino 180. A curated gallery of music, projects, and connections." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stino180" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    
    <!-- Critical CSS - inline for instant FCP -->
    <style>
      /* Critical path CSS for instant render */
      *,*::before,*::after{box-sizing:border-box}
      html,body{margin:0;padding:0;height:100%;overflow:hidden}
      body{font-family:system-ui,-apple-system,sans-serif;background:#0a0a0a;color:#fff}
      #root{height:100%;display:flex;flex-direction:column}
      .loading-skeleton{display:flex;align-items:center;justify-content:center;height:100%;background:#0a0a0a}
      .loading-spinner{width:2rem;height:2rem;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    
    <!-- Museum Typography - load async to not block render -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Allura&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Allura&display=swap" rel="stylesheet" media="print" onload="this.media='all';this.onload=null">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Allura&display=swap" rel="stylesheet"></noscript>
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  </head>
  <body>
    <div id="root">
      <!-- SSR-like fallback for instant FCP before JS loads -->
      <div class="loading-skeleton" id="initial-loader">
        <div class="loading-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
